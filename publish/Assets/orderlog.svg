<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="100%" stop-color="#0d150d"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hexagon background -->
  <polygon points="128,8 228,64 228,192 128,248 28,192 28,64"
           fill="url(#bgGrad)" stroke="#2a4a2a" stroke-width="3"/>

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#1e4d1e" stroke-width="2"/>

  <!-- Corner tick marks on ring -->
  <line x1="128" y1="40" x2="128" y2="56" stroke="#39d353" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="128" y1="200" x2="128" y2="216" stroke="#39d353" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="40" y1="128" x2="56" y2="128" stroke="#39d353" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="200" y1="128" x2="216" y2="128" stroke="#39d353" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Inner circle -->
  <circle cx="128" cy="128" r="52" fill="none" stroke="#2a5a2a" stroke-width="1.5"/>

  <!-- Crosshair lines -->
  <line x1="128" y1="76" x2="128" y2="108" stroke="#39d353" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="128" y1="148" x2="128" y2="180" stroke="#39d353" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="76" y1="128" x2="108" y2="128" stroke="#39d353" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="148" y1="128" x2="180" y2="128" stroke="#39d353" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Corner brackets -->
  <polyline points="88,92 88,80 100,80" fill="none" stroke="#39d353" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <polyline points="168,92 168,80 156,80" fill="none" stroke="#39d353" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <polyline points="88,164 88,176 100,176" fill="none" stroke="#39d353" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <polyline points="168,164 168,176 156,176" fill="none" stroke="#39d353" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- SS letters -->
  <text x="128" y="143" font-family="Arial, sans-serif" font-size="52" font-weight="900"
        fill="#39d353" text-anchor="middle" letter-spacing="-2" filter="url(#glow)">SS</text>
</svg>
